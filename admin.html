<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171914">
  <title>Randevular — MAKAS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#171914;font-family:'DM Sans',sans-serif}.top{background:#171914;color:#fff;padding:19px 0}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}.bar{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;letter-spacing:.2em}.logo span{color:#b5cb86}.tag{font-size:11px;color:#b5cb86;letter-spacing:.13em;text-transform:uppercase}.main{padding:45px 0}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.heading h1{font:600 42px 'Playfair Display',Georgia,serif;margin:9px 0 0}.eyebrow{font-size:10px;color:#78805e;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.refresh{background:#b5cb86;border:0;padding:12px 16px;font-weight:700;cursor:pointer}.stats{display:flex;gap:12px;margin-bottom:20px}.stat{background:#fffdf8;padding:15px 19px;min-width:130px;border:1px solid #e3e0d7}.stat strong{font:600 24px 'Playfair Display',Georgia,serif;display:block}.stat span{font-size:10px;color:#77796f;text-transform:uppercase;letter-spacing:.1em}.panel{background:#fffdf8;border:1px solid #e3e0d7;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:850px}th{text-align:left;background:#ebe9e1;color:#73766b;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:13px 14px}td{padding:15px 14px;border-top:1px solid #eceae3;font-size:12px;vertical-align:top}td strong{display:block;font-size:13px;margin-bottom:4px}td small{color:#77796f;font-size:11px}.status{border:1px solid #d8d8cd;background:#fffdf8;padding:8px 9px;font:11px 'DM Sans',sans-serif}.empty{text-align:center;color:#77796f;padding:55px 20px;font-size:13px}.error{color:#a4392b;padding:15px}.note{max-width:170px;white-space:normal;color:#77796f;font-size:11px}.date{white-space:nowrap}.updated{font-size:11px;color:#77796f;margin-top:12px}@media(max-width:600px){.heading h1{font-size:34px}.stats{overflow-x:auto}.stat{min-width:110px}.wrap{width:calc(100% - 28px)}}
  </style>
</head>
<body><header class="top"><div class="wrap bar"><a class="logo" href="/">MAKAS<span>.</span></a><span class="tag">Yönetim paneli</span></div></header>
  <main class="wrap main"><div class="heading"><div><div class="eyebrow">Randevu takvimi</div><h1>Gelen talepler</h1></div><button class="refresh" id="refresh">↻ &nbsp;Şimdi yenile</button></div>
    <div class="stats"><div class="stat"><strong id="countToday">0</strong><span>Bugün</span></div><div class="stat"><strong id="countNew">0</strong><span>Yeni talep</span></div><div class="stat"><strong id="countAll">0</strong><span>Toplam kayıt</span></div></div>
    <div class="panel"><table><thead><tr><th>Müşteri</th><th>İşlem</th><th>Tarih / saat</th><th>Not</th><th>Durum</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Randevular yükleniyor…</td></tr></tbody></table></div><div class="updated" id="updated">Yenileme bekleniyor…</div>
  </main>
<script>
const rows=document.querySelector('#rows'),updated=document.querySelector('#updated');let known=new Set(),firstLoad=true;
const today=new Date().toLocaleDateString('sv-SE');
async function load(){try{const response=await fetch('/api/admin/appointments',{cache:'no-store'});if(!response.ok)throw new Error('Randevular alınamadı. Sayfayı yenileyip tekrar giriş yapın.');const appointments=await response.json();const fresh=appointments.filter(item=>!known.has(item.id));if(!firstLoad&&fresh.length){document.title=`(${fresh.length}) Yeni randevu — MAKAS Admin`;if('Notification'in window&&Notification.permission==='granted')new Notification('Yeni randevu talebi',{body:`${fresh.map(a=>a.name).join(', ')} randevu talebi gönderdi.`});}appointments.forEach(item=>known.add(item.id));firstLoad=false;document.querySelector('#countAll').textContent=appointments.length;document.querySelector('#countNew').textContent=appointments.filter(item=>item.status==='Yeni').length;document.querySelector('#countToday').textContent=appointments.filter(item=>item.date===today).length;if(!appointments.length){rows.innerHTML='<tr><td colspan="5" class="empty">Henüz randevu talebi yok.</td></tr>';}else{rows.innerHTML=appointments.map(item=>`<tr><td><strong>${esc(item.name)}</strong><small>${esc(item.phone)}${item.email?`<br>${esc(item.email)}`:''}</small></td><td>${esc(item.service)}</td><td class="date"><strong>${dateLabel(item.date)}</strong><small>${esc(item.time)}</small></td><td class="note">${esc(item.note||'—')}</td><td><select class="status" data-id="${esc(item.id)}">${['Yeni','Onaylandı','Tamamlandı','İptal edildi'].map(s=>`<option ${item.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');rows.querySelectorAll('select').forEach(select=>select.addEventListener('change',async()=>{const result=await fetch(`/api/admin/appointments/${encodeURIComponent(select.dataset.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});if(!result.ok){alert('Durum güncellenemedi.');load();}}));}updated.textContent=`Son güncelleme: ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;}catch(error){rows.innerHTML=`<tr><td class="error" colspan="5">${esc(error.message)}</td></tr>`;}}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function dateLabel(value){const [y,m,d]=value.split('-');return `${d}.${m}.${y}`;}
document.querySelector('#refresh').addEventListener('click',load);if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();load();setInterval(load,15000);
</script></body></html>
